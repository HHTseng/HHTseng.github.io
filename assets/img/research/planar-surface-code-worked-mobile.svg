<svg xmlns="http://www.w3.org/2000/svg" width="548" height="2220" viewBox="0 0 548 2220" role="img" aria-labelledby="title desc">
<title id="title">A planar surface code from a relative cellular complex</title>
<desc id="desc">Three exact diagrams of a two-by-two face disk K. The left and right boundary arcs form the rough subcomplex A. Six horizontal edges and two interior vertical edges carry eight data qubits; the three remaining vertices index X checks and the four faces index Z checks. Panel a labels every relative basis cell. Panel b shows Z error h1L and recovery h1R with the same syndrome v1; their residual is a nontrivial relative cycle. Panel c shows a horizontal Z logical cycle, an equivalent upper representative, and a vertical dual X logical path that crosses each left horizontal edge. The two logical representatives pair to one over the binary field.</desc>
