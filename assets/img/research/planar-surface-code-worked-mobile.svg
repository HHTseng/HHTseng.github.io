 <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fbfaf6" /><stop offset="1" stop-color="#f3f2ed" /></linearGradient>
 <linearGradient id="card" x2="0" y2="1"><stop stop-color="#ffffff" /><stop offset="1" stop-color="#fcfbf8" /></linearGradient>
 <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#172f42" flood-opacity=".045" /></filter>
 <filter id="syndrome" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" /></filter>
 <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#157c86" stroke-width="1.5" /></marker>
 <marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#80649c" stroke-width="1.5" /></marker>
</defs>
